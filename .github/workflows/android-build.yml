name: Build LEAF APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Phone-friendly path: if the project was uploaded as one ZIP file instead of
      # as folders, unpack it here. Does nothing when the folders are already present.
      - name: Unpack project ZIP if needed
        shell: bash
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            ZIP=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::Project files not found. Upload the extracted files (or LEAF-source.zip) to the repository root."
              exit 1
            fi
            echo "Unpacking $ZIP"
            unzip -q -o "$ZIP"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEAF-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEAF-build-logs
          path: |
            build.log
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
